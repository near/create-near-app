name: Test Contract RS
on:
  push:
    paths: ["templates/contracts/**/rs/**", "src/**", "index.js", "package.json"]
  pull_request:
    paths: ["templates/contracts/**/rs/**", "src/**", "index.js", "package.json"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_ENV: 'ci'
jobs:
  tests:
    strategy:
      matrix:
        platform: [ubuntu-latest]
        template: [auction, auction-adv]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install modules
      run: npm install
    - name: Install system dependencies
      if: matrix.platform == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y libudev-dev
    - name: Create Contract RS - ${{ matrix.template }}
      run: npm run start -- test-app --frontend none --contract rs --template ${{ matrix.template }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: test-app
    - name: Install cargo-near
      run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
    - name: Run tests
      run: cd test-app && cargo test
