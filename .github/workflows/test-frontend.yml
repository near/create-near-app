name: Test Frontend
on:
  push:
    paths: ["templates/frontend/**", "src/**", "index.js", "package.json"]
  pull_request:
    paths: ["templates/frontend/**", "src/**", "index.js", "package.json"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_ENV: 'ci'
jobs:
  tests:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
        node-version: [22, 24]
        frontend: [next-page, next-app, vite-react]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install modules
      run: npm install
    - name: Create Frontend - ${{ matrix.frontend }}
      run: npm run start -- test-app --frontend ${{ matrix.frontend }}
    - name: Install
      run: cd test-app && npm install